[configuration]
id = "SeedVR"
name = "SeedVR Upscaler"
description = "Upscales colorized SD frames, backgrounds and sprites to HD with SeedVR2, through a service on this or another computer"
author = "PPUC"
version = "0.1.0"
link = "https://github.com/PPUC/ColorizingDMD-SeedVR"

[libraries]
windows.x64 = "plugin-seedvr64.dll"
linux.x64 = "plugin-seedvr.so"
linux.aarch64 = "plugin-seedvr.so"
macos.arm64 = "plugin-seedvr.dylib"
